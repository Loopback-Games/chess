<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm",
        "peerjs": "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/+esm"
      }
    }
  </script>
</head>
<body>
  <main class="lobby">
    <h1>♞ Chess</h1>
    <p class="tagline">Play a friend online — no account needed. Create a game and share the link.</p>
    <form id="create" class="card">
      <label>Your name
        <input id="name" maxlength="24" placeholder="Anonymous" autocomplete="nickname" />
      </label>
      <label>Time control
        <select id="tc">
          <option value="none">Untimed</option>
          <option value="1+0">Bullet · 1+0</option>
          <option value="3+2">Blitz · 3+2</option>
          <option value="5+0">Blitz · 5+0</option>
          <option value="10+0" selected>Rapid · 10+0</option>
          <option value="15+10">Rapid · 15+10</option>
        </select>
      </label>
      <fieldset class="colors">
        <legend>Play as</legend>
        <label><input type="radio" name="color" value="random" checked /> Random</label>
        <label><input type="radio" name="color" value="w" /> White</label>
        <label><input type="radio" name="color" value="b" /> Black</label>
      </fieldset>
      <button type="submit" class="primary">Create game</button>
      <p id="err" class="error" hidden></p>
    </form>
    <form id="joinForm" class="card">
      <label>Have a link or code?
        <input id="code" placeholder="Paste a game link or code" />
      </label>
      <button type="submit">Join</button>
    </form>
  </main>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
