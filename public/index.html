<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loopback Chess</title>
  <meta name="description" content="Play 8-bit chess with a friend online. No account needed." />
  <meta name="theme-color" content="#101015" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
      }
    }
  </script>
</head>
<body>
  <main class="lobby">
    <header class="hero">
      <img src="img/logo.png" alt="Loopback Games logo" width="112" height="112" />
      <div class="studio">LOOPBACK GAMES</div>
      <h1 class="gradient-text">LOOPBACK<br />CHESS</h1>
      <p class="tagline">Play a friend online. No account needed. Create a game and share the link.</p>
    </header>

    <section id="mygames" class="card" hidden>
      <h2>Your games</h2>
      <ul id="gamelist" class="gamelist"></ul>
    </section>

    <form id="create" class="card">
      <h2>New game</h2>
      <label><span class="lbl">Your name</span>
        <input id="name" maxlength="24" placeholder="PLAYER 1" autocomplete="nickname" />
      </label>
      <label><span class="lbl">Time control</span>
        <select id="tc">
          <optgroup label="Daily · play over days">
            <option value="1d">1 day per move</option>
            <option value="3d" selected>3 days per move</option>
            <option value="7d">7 days per move</option>
          </optgroup>
          <optgroup label="Live">
            <option value="1+0">Bullet · 1+0</option>
            <option value="3+2">Blitz · 3+2</option>
            <option value="5+0">Blitz · 5+0</option>
            <option value="10+0">Rapid · 10+0</option>
            <option value="15+10">Rapid · 15+10</option>
          </optgroup>
          <optgroup label="No clock">
            <option value="none">Untimed</option>
          </optgroup>
        </select>
      </label>
      <fieldset class="colors">
        <legend>Play as</legend>
        <label><input type="radio" name="color" value="random" checked /><span>Random</span></label>
        <label><input type="radio" name="color" value="w" /><span>White</span></label>
        <label><input type="radio" name="color" value="b" /><span>Black</span></label>
      </fieldset>
      <button type="submit" class="primary">▶ Start game</button>
      <p id="err" class="error" hidden></p>
    </form>

    <form id="joinForm" class="card">
      <h2>Join a game</h2>
      <label><span class="lbl">Link or code</span>
        <input id="code" placeholder="Paste a game link or code" />
      </label>
      <button type="submit">Join</button>
    </form>

    <p class="footer">© Loopback Games</p>
  </main>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
