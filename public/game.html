<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess game</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="./" class="brand">♞ Chess</a>
    <div class="share">
      <input id="link" readonly aria-label="Game link" />
      <button id="copy">Copy link</button>
    </div>
  </header>
  <main class="game">
    <section class="board-col">
      <div class="player" id="top"><span class="dot"></span><span class="pname"></span><span class="clock"></span></div>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        <div id="promo" class="promo" hidden></div>
      </div>
      <div class="player" id="bottom"><span class="dot"></span><span class="pname"></span><span class="clock"></span></div>
    </section>
    <aside class="side">
      <div id="status" class="status card">Connecting…</div>
      <div id="banner" class="banner card" hidden></div>
      <div class="actions">
        <button id="flip" title="Flip board">⇅ Flip</button>
        <button id="draw">½ Offer draw</button>
        <button id="resign" class="danger">⚑ Resign</button>
        <button id="rematch" class="primary" hidden>Rematch</button>
      </div>
      <div class="card moves-card">
        <h2>Moves</h2>
        <ol id="moves" class="moves"></ol>
      </div>
      <div class="card chat-card">
        <h2>Chat</h2>
        <div id="chat" class="chat"></div>
        <form id="chatForm"><input id="chatInput" maxlength="300" placeholder="Say something…" autocomplete="off" /></form>
      </div>
    </aside>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
