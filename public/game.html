<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loopback Chess · Game</title>
  <meta name="theme-color" content="#101015" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="./" class="brand"><img src="img/logo.png" alt="" width="36" height="36" /><span class="gradient-text">LOOPBACK CHESS</span></a>
    <div class="share">
      <input id="link" readonly aria-label="Game link" />
      <button id="copy">Copy link</button>
      <button id="sound" class="ghost icon-btn" aria-label="Toggle sound" title="Toggle sound">♪</button>
    </div>
  </header>
  <main class="game">
    <section class="board-col">
      <div class="player" id="top"><span class="dot"></span><span class="pname"></span><button class="rename ghost icon-btn" title="Change your name" aria-label="Change your name" hidden>✎</button><span class="clock"></span></div>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        <div id="promo" class="promo" hidden></div>
      </div>
      <div class="player" id="bottom"><span class="dot"></span><span class="pname"></span><button class="rename ghost icon-btn" title="Change your name" aria-label="Change your name" hidden>✎</button><span class="clock"></span></div>
    </section>
    <aside class="side">
      <div id="status" class="status card">Connecting…</div>
      <div id="banner" class="banner card" hidden></div>
      <div class="actions">
        <button id="flip" title="Flip board">⇅ Flip</button>
        <button id="draw">½ Draw</button>
        <button id="resign" class="danger">⚑ Resign</button>
        <button id="rematch" class="primary" hidden>▶ Rematch</button>
      </div>
      <div class="card moves-card">
        <h2>Moves</h2>
        <ol id="moves" class="moves"></ol>
      </div>
      <div class="card chat-card">
        <h2>Chat</h2>
        <div id="chat" class="chat"></div>
        <form id="chatForm"><input id="chatInput" maxlength="300" placeholder="Say something…" autocomplete="off" /></form>
      </div>
    </aside>
  </main>
  <dialog id="nameDialog" class="name-dialog">
    <form id="nameForm" method="dialog" class="card">
      <h2 id="nameTitle">Who's playing?</h2>
      <p class="note" id="nameHint">Enter a name so your opponent knows who they're up against.</p>
      <input id="nameInput" maxlength="24" placeholder="PLAYER 2" autocomplete="nickname" required />
      <button type="submit" class="primary">▶ Join game</button>
    </form>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
